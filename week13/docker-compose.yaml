version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC (faster, used by qdrant-client)
    volumes:
      - qdrant_data:/qdrant/storage   # persist vectors across restarts
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

volumes:
  qdrant_data: